<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cờ Vua — Chẩn đoán</title><link rel="stylesheet" href="./style.css"></head>
<body><main class="app"><header><div><p class="eyebrow">COVUA · DIAGNOSTICS</p><h1>Chẩn đoán web</h1><p class="sub">Kiểm tra nhanh các tệp và tài nguyên cần để chạy bàn cờ.</p></div><a href="./index.html" style="color:inherit">Quay lại bàn cờ</a></header><section class="panel"><h2 id="summary">Đang kiểm tra…</h2><ul id="results"></ul><p class="note">Nếu một kiểm tra thất bại, mở DevTools (F12) → Console và Network để xem lỗi chi tiết. Trang này không gửi dữ liệu ra máy chủ.</p></section></main><script>
(async()=>{const rows=[['HTML chính','./index.html'],['JavaScript bàn cờ','./app.js'],['CSS','./style.css'],['Script log lỗi','./diagnostics.js'],['Quân trắng (vua)','./assneo/wk.png'],['Quân trắng (hậu)','./assneo/wq.png'],['Quân đen (vua)','./assneo/bk.png'],['Thư viện luật chess.js','https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js']];const out=document.getElementById('results');let bad=0;for(const [name,url] of rows){const li=document.createElement('li');try{const r=await fetch(url,{method:'HEAD',cache:'no-store'});li.textContent=(r.ok?'PASS':'FAIL')+' — '+name+' ('+r.status+')';if(!r.ok)bad++;}catch(e){li.textContent='FAIL — '+name+' ('+e.message+')';bad++;}out.append(li)}document.getElementById('summary').textContent=bad?'Có '+bad+' kiểm tra thất bại':'Các kiểm tra cơ bản đều đạt';})();
</script></body></html>
