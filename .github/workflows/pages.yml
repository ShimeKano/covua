name: Validate and deploy GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install pinned Stockfish 19 Lite Single
        run: |
          npm install --prefix /tmp/covua-stockfish --no-save --no-audit --no-fund stockfish@19.0.1
          mkdir -p stockfish
          cp /tmp/covua-stockfish/node_modules/stockfish/bin/stockfish-19-lite-single.js stockfish/
          cp /tmp/covua-stockfish/node_modules/stockfish/bin/stockfish-19-lite-single.wasm stockfish/
          cp /tmp/covua-stockfish/node_modules/stockfish/Copying.txt stockfish/ || true
          test -s stockfish/stockfish-19-lite-single.js
          test -s stockfish/stockfish-19-lite-single.wasm
      - name: Scan required files, HTML references, UI hooks, chess assets, and Stockfish files
        run: node scripts/check-site.mjs
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check diagnostics.js
  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install pinned Stockfish 19 Lite Single
        run: |
          npm install --prefix /tmp/covua-stockfish --no-save --no-audit --no-fund stockfish@19.0.1
          mkdir -p stockfish
          cp /tmp/covua-stockfish/node_modules/stockfish/bin/stockfish-19-lite-single.js stockfish/
          cp /tmp/covua-stockfish/node_modules/stockfish/bin/stockfish-19-lite-single.wasm stockfish/
          cp /tmp/covua-stockfish/node_modules/stockfish/Copying.txt stockfish/ || true
          test -s stockfish/stockfish-19-lite-single.js
          test -s stockfish/stockfish-19-lite-single.wasm
      - name: Run pre-deploy checks
        run: node scripts/check-site.mjs
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check diagnostics.js
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
