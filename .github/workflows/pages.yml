name: Validate and deploy GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Scan required files, HTML references, UI hooks, and chess assets
        run: node scripts/check-site.mjs
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check diagnostics.js
  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Run pre-deploy checks
        run: node scripts/check-site.mjs
      - name: Download pinned Stockfish browser engine locally
        run: |
          mkdir -p stockfish
          curl --fail --location --retry 2 --retry-all-errors "https://unpkg.com/stockfish@17.1.0/src/stockfish-17.1-lite-single-03e3232.js" --output stockfish/stockfish-17.1-lite-single-03e3232.js || curl --fail --location --retry 2 --retry-all-errors "https://cdn.jsdelivr.net/npm/stockfish@17.1.0/src/stockfish-17.1-lite-single-03e3232.js" --output stockfish/stockfish-17.1-lite-single-03e3232.js
          curl --fail --location --retry 2 --retry-all-errors "https://unpkg.com/stockfish@17.1.0/src/stockfish-17.1-lite-single-03e3232.wasm" --output stockfish/stockfish-17.1-lite-single-03e3232.wasm || curl --fail --location --retry 2 --retry-all-errors "https://cdn.jsdelivr.net/npm/stockfish@17.1.0/src/stockfish-17.1-lite-single-03e3232.wasm" --output stockfish/stockfish-17.1-lite-single-03e3232.wasm
          test -s stockfish/stockfish-17.1-lite-single-03e3232.js
          test -s stockfish/stockfish-17.1-lite-single-03e3232.wasm
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
